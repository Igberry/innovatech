    <main>
        <section id="contact" class="section" data-aos="fade-up">
            <h2>Contact Us</h2>
            <form id="contactForm" novalidate>
                <input type="text" name="name" id="name" placeholder="Your Name" required minlength="2" />
                <input type="email" name="email" id="email" placeholder="Your Email" required />
                <textarea name="message" id="message" placeholder="Your Message" required minlength="10"></textarea>
                <button type="submit" class="btn">Send Message</button>
                <p id="formResponse" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>
