    <main>
        <section class="booking-section">
            <h2>Book a Free Consultation</h2>
            <p>Fill in your details below and we’ll reach out to confirm your session.</p>
            <form id="bookingForm">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>

                <!-- ✅ Phone number with country code -->
                <div style="display: flex; gap: 5px;">
                    <select name="country_code" required style="width: 30%;">
                        <option value="+234" selected>🇳🇬 +234 (NG)</option>
                        <option value="+1">🇺🇸 +1 (US)</option>
                        <option value="+44">🇬🇧 +44 (UK)</option>
                        <option value="+91">🇮🇳 +91 (IN)</option>
                        <option value="+27">🇿🇦 +27 (ZA)</option>
                        <option value="+61">🇦🇺 +61 (AU)</option>
                        <option value="+81">🇯🇵 +81 (JP)</option>
                        <option value="+49">🇩🇪 +49 (DE)</option>
                        <option value="+33">🇫🇷 +33 (FR)</option>
                        <option value="+39">🇮🇹 +39 (IT)</option>
                        <option value="+86">🇨🇳 +86 (CN)</option>
                        <option value="+7">🇷🇺 +7 (RU)</option>
                        <option value="+351">🇵🇹 +351 (PT)</option>
                        <option value="+34">🇪🇸 +34 (ES)</option>
                        <option value="+46">🇸🇪 +46 (SE)</option>
                        <option value="+31">🇳🇱 +31 (NL)</option>
                        <option value="+41">🇨🇭 +41 (CH)</option>
                        <option value="+55">🇧🇷 +55 (BR)</option>
                        <option value="+52">🇲🇽 +52 (MX)</option>
                        <option value="+82">🇰🇷 +82 (KR)</option>
                        <option value="+62">🇮🇩 +62 (ID)</option>
                        <option value="+63">🇵🇭 +63 (PH)</option>
                        <option value="+20">🇪🇬 +20 (EG)</option>
                        <option value="+212">🇲🇦 +212 (MA)</option>
                        <option value="+254">🇰🇪 +254 (KE)</option>
                        <option value="+256">🇺🇬 +256 (UG)</option>
                        <option value="+255">🇹🇿 +255 (TZ)</option>
                        <option value="+66">🇹🇭 +66 (TH)</option>
                        <option value="+90">🇹🇷 +90 (TR)</option>
                        <option value="+358">🇫🇮 +358 (FI)</option>
                        <option value="+973">🇧🇭 +973 (BH)</option>
                        <option value="+974">🇶🇦 +974 (QA)</option>
                        <option value="+965">🇰🇼 +965 (KW)</option>
                        <option value="+961">🇱🇧 +961 (LB)</option>
                    </select>

                    <input type="tel" name="phone" placeholder="Phone Number" required style="flex: 1;">
                </div>

                <select name="service" required>
                    <option disabled selected>Select a service</option>
                    <option>Website Development</option>
                    <option>Mobile App Development</option>
                    <option>Graphic Design</option>
                    <option>Video Editing</option>
                    <option>Video Ads Creation</option>
                    <option>UI/UX Design</option>
                    <option>QR Code Solutions</option>
                    <option>Tech Innovation</option>
                    <option>Others</option>
                </select>

                <input type="date" name="preferred_date" required>

                <textarea name="message" placeholder="Tell us more about your project..." rows="4"></textarea>

                <button type="submit" class="btn">Submit</button>

                <!-- ✅ Message display area -->
                <div id="form-message" style="margin-top: 10px;"></div>
            </form>

        </section>
